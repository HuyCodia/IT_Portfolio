<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131A"/>
      <stop offset="50%" stop-color="#141A23"/>
      <stop offset="100%" stop-color="#0B0F14"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFFF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5C0"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#293241" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Window Chrome Header -->
  <rect x="0" y="0" width="1200" height="48" fill="#161B22" stroke="#293241" stroke-width="1"/>
  <circle cx="28" cy="24" r="6" fill="#EF4444" opacity="0.8"/>
  <circle cx="48" cy="24" r="6" fill="#F59E0B" opacity="0.8"/>
  <circle cx="68" cy="24" r="6" fill="#10B981" opacity="0.8"/>

  <!-- URL Bar -->
  <rect x="180" y="10" width="540" height="28" rx="6" fill="#0B0F14" stroke="#293241" stroke-width="1"/>
  <text x="210" y="29" fill="#00BFFF" font-family="'JetBrains Mono', monospace" font-size="12">https://</text>
  <text x="268" y="29" fill="#A7B0BE" font-family="'JetBrains Mono', monospace" font-size="12">algo-visualizer.huydang.dev/dijkstra-graph</text>
  <circle cx="196" cy="24" r="3.5" fill="#00E5C0"/>

  <!-- Status pill in chrome -->
  <rect x="1020" y="10" width="150" height="28" rx="6" fill="#132C1C" stroke="#4ADE80" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="1038" cy="24" r="4" fill="#4ADE80"/>
  <text x="1052" y="28" fill="#4ADE80" font-family="'Inter', sans-serif" font-size="11" font-weight="600">ENGINE ACTIVE</text>

  <!-- Left Sidebar (Algorithm Controls & Code) -->
  <rect x="0" y="48" width="320" height="627" fill="#11161D" stroke="#293241" stroke-width="1"/>

  <!-- Algorithm Title -->
  <text x="24" y="90" fill="#F5F7FA" font-family="'Outfit', sans-serif" font-size="18" font-weight="700">Dijkstra Shortest Path</text>
  <text x="24" y="112" fill="#A7B0BE" font-family="'JetBrains Mono', monospace" font-size="11">Time: O((V + E) log V)</text>

  <!-- Step & Controls -->
  <rect x="24" y="135" width="272" height="68" rx="8" fill="#161B22" stroke="#293241" stroke-width="1"/>
  <text x="40" y="162" fill="#A7B0BE" font-family="'Inter', sans-serif" font-size="11">Execution Progress</text>
  <text x="40" y="185" fill="#00BFFF" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">Step 14 / 24</text>
  <rect x="190" y="160" width="90" height="28" rx="6" fill="#00BFFF" opacity="0.15" stroke="#00BFFF" stroke-width="1"/>
  <text x="214" y="178" fill="#00BFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="600">▶ Pause</text>

  <!-- Interactive Matrix Info -->
  <text x="24" y="240" fill="#A7B0BE" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">PRIORITY QUEUE (MIN-HEAP)</text>
  <g transform="translate(24, 255)">
    <rect x="0" y="0" width="272" height="32" rx="4" fill="#161B22" stroke="#293241" stroke-width="1"/>
    <text x="12" y="21" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="12">Node C (dist: 4)</text>
    <rect x="210" y="6" width="50" height="20" rx="3" fill="#132C1C"/>
    <text x="218" y="20" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="10">VISITING</text>
  </g>
  <g transform="translate(24, 295)">
    <rect x="0" y="0" width="272" height="32" rx="4" fill="#161B22" stroke="#293241" stroke-width="1"/>
    <text x="12" y="21" fill="#A7B0BE" font-family="'JetBrains Mono', monospace" font-size="12">Node E (dist: 7)</text>
    <text x="220" y="20" fill="#A7B0BE" font-family="'JetBrains Mono', monospace" font-size="10">QUEUED</text>
  </g>
  <g transform="translate(24, 335)">
    <rect x="0" y="0" width="272" height="32" rx="4" fill="#161B22" stroke="#293241" stroke-width="1"/>
    <text x="12" y="21" fill="#A7B0BE" font-family="'JetBrains Mono', monospace" font-size="12">Node F (dist: 11)</text>
    <text x="220" y="20" fill="#A7B0BE" font-family="'JetBrains Mono', monospace" font-size="10">QUEUED</text>
  </g>

  <!-- Mini Code Snippet in Sidebar -->
  <text x="24" y="415" fill="#A7B0BE" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">ALGORITHM CORE (TS)</text>
  <rect x="24" y="430" width="272" height="195" rx="6" fill="#0B0F14" stroke="#293241" stroke-width="1"/>
  <text x="36" y="455" fill="#8B5CF6" font-family="'JetBrains Mono', monospace" font-size="11">while <tspan fill="#F5F7FA">(!queue.isEmpty()) {</tspan></text>
  <text x="48" y="475" fill="#00BFFF" font-family="'JetBrains Mono', monospace" font-size="11">const <tspan fill="#F5F7FA">curr = queue.pop();</tspan></text>
  <text x="48" y="495" fill="#A7B0BE" font-family="'JetBrains Mono', monospace" font-size="11">for (const edge of curr.edges) {</text>
  <text x="60" y="515" fill="#00E5C0" font-family="'JetBrains Mono', monospace" font-size="11">const alt = dist[u] + edge.w;</text>
  <text x="60" y="535" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11">if (alt &lt; dist[v]) {</text>
  <text x="72" y="555" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="11">dist[v] = alt;</text>
  <text x="72" y="575" fill="#A7B0BE" font-family="'JetBrains Mono', monospace" font-size="11">prev[v] = u;</text>
  <text x="60" y="595" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11">}</text>
  <text x="48" y="615" fill="#A7B0BE" font-family="'JetBrains Mono', monospace" font-size="11">}</text>

  <!-- Main Graph Canvas Area -->
  <!-- Graph Edges -->
  <path d="M 450 180 L 620 120" stroke="#00BFFF" stroke-width="3" stroke-dasharray="6 4" filter="url(#cyanGlow)" opacity="0.9"/>
  <path d="M 450 180 L 520 340" stroke="#8B5CF6" stroke-width="3" opacity="0.7"/>
  <path d="M 620 120 L 820 180" stroke="#00BFFF" stroke-width="4" filter="url(#cyanGlow)"/>
  <path d="M 520 340 L 760 380" stroke="#4ADE80" stroke-width="3" stroke-dasharray="4 4" opacity="0.8"/>
  <path d="M 620 120 L 720 280" stroke="#293241" stroke-width="2"/>
  <path d="M 720 280 L 980 320" stroke="#00E5C0" stroke-width="4" filter="url(#cyanGlow)"/>
  <path d="M 820 180 L 1050 190" stroke="#00BFFF" stroke-width="4" filter="url(#cyanGlow)"/>
  <path d="M 760 380 L 980 320" stroke="#293241" stroke-width="2"/>
  <path d="M 980 320 L 1050 190" stroke="#8B5CF6" stroke-width="3" opacity="0.7"/>

  <!-- Edge Weight Badges -->
  <rect x="520" y="132" width="28" height="18" rx="4" fill="#161B22" stroke="#00BFFF" stroke-width="1"/>
  <text x="528" y="145" fill="#00BFFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">2</text>

  <rect x="710" y="138" width="28" height="18" rx="4" fill="#161B22" stroke="#00BFFF" stroke-width="1"/>
  <text x="718" y="151" fill="#00BFFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">5</text>

  <rect x="465" y="250" width="28" height="18" rx="4" fill="#161B22" stroke="#293241" stroke-width="1"/>
  <text x="473" y="263" fill="#A7B0BE" font-family="'JetBrains Mono', monospace" font-size="10">8</text>

  <rect x="830" y="285" width="28" height="18" rx="4" fill="#161B22" stroke="#00E5C0" stroke-width="1"/>
  <text x="838" y="298" fill="#00E5C0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">3</text>

  <rect x="930" y="170" width="28" height="18" rx="4" fill="#161B22" stroke="#00BFFF" stroke-width="1"/>
  <text x="938" y="183" fill="#00BFFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">4</text>

  <!-- Graph Nodes -->
  <!-- Node A (Start) -->
  <g transform="translate(450, 180)">
    <circle r="36" fill="#0B0F14" stroke="#00BFFF" stroke-width="3" filter="url(#nodeGlow)"/>
    <circle r="26" fill="url(#cyanPurple)"/>
    <text x="0" y="7" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">A</text>
    <rect x="-35" y="-55" width="70" height="18" rx="4" fill="#161B22" stroke="#00BFFF" stroke-width="1"/>
    <text x="0" y="-42" text-anchor="middle" fill="#00BFFF" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">START (0)</text>
  </g>

  <!-- Node B -->
  <g transform="translate(620, 120)">
    <circle r="30" fill="#0B0F14" stroke="#00BFFF" stroke-width="3" filter="url(#cyanGlow)"/>
    <circle r="22" fill="#161B22"/>
    <text x="0" y="6" text-anchor="middle" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">B</text>
    <text x="0" y="44" text-anchor="middle" fill="#00BFFF" font-family="'JetBrains Mono', monospace" font-size="11">dist: 2</text>
  </g>

  <!-- Node C (Active Visiting) -->
  <g transform="translate(820, 180)">
    <circle r="34" fill="#0B0F14" stroke="#4ADE80" stroke-width="3" filter="url(#nodeGlow)"/>
    <circle r="26" fill="#132C1C"/>
    <text x="0" y="7" text-anchor="middle" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">C</text>
    <rect x="-38" y="-55" width="76" height="18" rx="4" fill="#132C1C" stroke="#4ADE80" stroke-width="1"/>
    <text x="0" y="-42" text-anchor="middle" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">ACTIVE (4)</text>
  </g>

  <!-- Node D -->
  <g transform="translate(520, 340)">
    <circle r="28" fill="#0B0F14" stroke="#8B5CF6" stroke-width="2"/>
    <circle r="20" fill="#161B22"/>
    <text x="0" y="6" text-anchor="middle" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">D</text>
    <text x="0" y="42" text-anchor="middle" fill="#8B5CF6" font-family="'JetBrains Mono', monospace" font-size="11">dist: 8</text>
  </g>

  <!-- Node E -->
  <g transform="translate(720, 280)">
    <circle r="28" fill="#0B0F14" stroke="#293241" stroke-width="2"/>
    <circle r="20" fill="#161B22"/>
    <text x="0" y="6" text-anchor="middle" fill="#A7B0BE" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">E</text>
    <text x="0" y="42" text-anchor="middle" fill="#A7B0BE" font-family="'JetBrains Mono', monospace" font-size="11">dist: ∞</text>
  </g>

  <!-- Node F -->
  <g transform="translate(760, 380)">
    <circle r="28" fill="#0B0F14" stroke="#293241" stroke-width="2"/>
    <circle r="20" fill="#161B22"/>
    <text x="0" y="6" text-anchor="middle" fill="#A7B0BE" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">F</text>
    <text x="0" y="42" text-anchor="middle" fill="#A7B0BE" font-family="'JetBrains Mono', monospace" font-size="11">dist: ∞</text>
  </g>

  <!-- Node G -->
  <g transform="translate(980, 320)">
    <circle r="30" fill="#0B0F14" stroke="#00E5C0" stroke-width="3" filter="url(#cyanGlow)"/>
    <circle r="22" fill="#161B22"/>
    <text x="0" y="6" text-anchor="middle" fill="#00E5C0" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">G</text>
    <text x="0" y="44" text-anchor="middle" fill="#00E5C0" font-family="'JetBrains Mono', monospace" font-size="11">dist: 7</text>
  </g>

  <!-- Target Node H -->
  <g transform="translate(1050, 190)">
    <circle r="36" fill="#0B0F14" stroke="#00BFFF" stroke-width="3" filter="url(#nodeGlow)"/>
    <circle r="26" fill="url(#neonGreen)"/>
    <text x="0" y="7" text-anchor="middle" fill="#0B0F14" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800">TARGET</text>
    <rect x="-42" y="-55" width="84" height="18" rx="4" fill="#161B22" stroke="#4ADE80" stroke-width="1"/>
    <text x="0" y="-42" text-anchor="middle" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">SHORTEST: 11</text>
  </g>
</svg>
